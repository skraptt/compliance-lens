# Answer key for the Nordwind demo documents, checklist v0.3, assessed as of 2026-11-18.
#
# One entry per check that runs on the document's primary obligations (state "run").
#   expected  covered | partial | missing | contradicts
#   accept    other answers that are also defensible (ambiguous wording); scored as correct
#   at        section number(s) of the relevant paragraph(s)
# `planted` marks the deliberate errors that a demo should surface.

meta:
  checklist_version: 0.3.0
  as_of: 2026-11-18
  author: Claude (draft) - to be confirmed by a lawyer
  revisions:
    - "2026-11-18: after the first blind run, six alternative answers were accepted where the model's reading was defensible (REP-05.c1, INS-01.c5, DIS-03.c4, MAN-01.c4, MAN-02.c1, REP-02.c4). Expected answers and planted errors were not changed."
    - "2026-11-18: after the first real run (Sonnet via Claude Code), three more alternatives were accepted (INS-01.c2, DIS-04.c2, DIS-05.c1). The other twelve mismatches were treated as prompt problems and the prompt was changed instead."

